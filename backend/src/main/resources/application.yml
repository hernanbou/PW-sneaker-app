server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sneaker-store-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sneaker_store}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWZvci1zbmVha2VyLXN0b3JlLWp3dC1zaWduYXR1cmU=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
